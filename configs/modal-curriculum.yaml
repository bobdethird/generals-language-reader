# AverageJoe curriculum and reference evaluation, adapted to the existing small model.
# Continue from cumulative iteration 1500; preserve weights, optimizer and EMA.
run_name: modal_curriculum
pad_to: 12
min_grid_size: 11
max_grid_size: 12
min_generals_distance: 2
max_generals_distance: 6
truncation: 512
mountain_density_min: 0.15
mountain_density_max: 0.22
castle_val_min: 13
castle_val_max: 18
num_cities_min: 1
num_cities_max: 3
pool_size: 4096
reset_pool_every: 20
network: history_transformer
depth: 3
embed_dim: 128
n_head: 4
ff_factor: 2
patch_size: 3
use_bf16: true
ema_decay: 0.99
num_envs: 256
num_steps: 256
num_iters: 98500
minibatch_size: 1024
num_epochs: 1
seed: 146
lr: 0.0001
gamma: 1.0
gae_lambda: 0.9
clip_eps: 0.2
max_grad_norm: 0.267
vf_coef: 0.5
adv_top_frac: 0.5
ent_schedule: power_law
ent_coef_start: 0.05
ent_power: 0.2
ent_coef_min: 0.001
value_loss: ce
num_bins: 128
v_min: -1.0
v_max: 1.0
hl_sigma: 0.04
eval_every: 50
eval_games: 128
ckpt_every: 500
save_every: 500
ref_eval_every: 250
debug: false
iteration_offset: 1500
init_checkpoint:
  /runs/modal-h100-continue-v1/checkpoints/modal_continue/modal_continue_final.eqx
ema_checkpoint:
  /runs/modal-h100-continue-v1/checkpoints/modal_continue/modal_continue_ema_1200.eqx
ref_eval_games: 64
ref_eval_dir: references
ref_eval_min_grid_size: 12
ref_eval_max_grid_size: 12
ref_eval_min_generals_distance: 4
ref_eval_max_generals_distance: 10
ref_eval_num_cities_min: 1
ref_eval_num_cities_max: 3
ref_eval_castle_val_min: 13
ref_eval_castle_val_max: 18
ref_eval_truncation: 512
curriculum:
- min_generals_distance: 2
  max_generals_distance: 6
- win_rate_threshold: 0.6
  min_generals_distance: 4
  max_generals_distance: 8
- win_rate_threshold: 0.6
  min_generals_distance: 6
  max_generals_distance: 10
- win_rate_threshold: 0.6
  min_generals_distance: 8
  max_generals_distance: 12
