# Throughput test: 1,024 total games; 39,321,600 player samples.
# EMA decay is rescaled to retain its original sample-based time horizon.
# Requires two GPUs: num_envs and minibatch_size are PER DEVICE.
run_name: modal_dual
pad_to: 12
min_grid_size: 11
max_grid_size: 12
min_generals_distance: 2
max_generals_distance: 6
truncation: 512
mountain_density_min: 0.15
mountain_density_max: 0.22
castle_val_min: 13
castle_val_max: 18
num_cities_min: 1
num_cities_max: 3
pool_size: 4096
reset_pool_every: 20
network: history_transformer
depth: 3
embed_dim: 128
n_head: 4
ff_factor: 2
patch_size: 3
use_bf16: true
ema_decay: 0.96059601
num_envs: 512
num_steps: 256
num_iters: 75
minibatch_size: 2048
num_epochs: 1
seed: 144
lr: 0.0001
gamma: 1.0
gae_lambda: 0.9
clip_eps: 0.2
max_grad_norm: 0.267
vf_coef: 0.5
adv_top_frac: 0.5
ent_schedule: power_law
ent_coef_start: 0.05
ent_power: 0.2
ent_coef_min: 0.001
value_loss: ce
num_bins: 128
v_min: -1.0
v_max: 1.0
hl_sigma: 0.04
eval_every: 25
eval_games: 64
ckpt_every: 25
save_every: 25
ref_eval_every: 0
debug: false
